{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Bagredex{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/css/site.css' %}">
  </head>
  <body>
    {% if request.user.is_authenticated %}
      <header class="site-header">
        <a class="site-header__brand" href="{% url 'home' %}">Bagredex</a>
        <div class="site-header__account">
          <span class="site-header__identity">
            {% firstof request.user.get_short_name request.user.get_username %}
          </span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="button button--secondary" type="submit">Log out</button>
          </form>
        </div>
      </header>
    {% endif %}
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
