services:
  database:
    image: docker.io/library/postgres:17.6-alpine
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database-data:/var/lib/postgresql/data
    networks: [application]

  server:
    depends_on:
      database:
        condition: service_healthy
    environment:
      BAGREDEX_DOMAIN: ${BAGREDEX_DOMAIN:-localhost}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/health/ready',
          headers={'Host': os.environ['BAGREDEX_DOMAIN'], 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]

networks:
  application:
    internal: true

volumes:
  database-data:
    name: bagredex-database
