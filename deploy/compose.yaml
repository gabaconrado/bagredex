services:
  server:
    environment:
      BAGREDEX_DOMAIN: ${BAGREDEX_DOMAIN:-localhost}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/health/ready',
          headers={'Host': os.environ['BAGREDEX_DOMAIN'], 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]

networks:
  application:
