name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: 0.8.15

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: versions
        run: echo "node=$(awk '$1 == \"nodejs\" { print $2 }' .tool-versions)" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm --prefix src/web ci --ignore-scripts --no-audit --no-fund
      - run: ./bagredex.sh check-web

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Podman runtime
        run: |
          podman version
          podman info
      - id: versions
        run: echo "python=$(awk '$1 == \"python\" { print $2 }' .tool-versions)" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - run: uv --directory src/backend sync --frozen
      - run: ./bagredex.sh check-backend
      - run: ./bagredex.sh test

  docs-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation tools
        run: |
          cargo install rumdl --version 0.2.60 --locked
          sudo apt-get update
          sudo apt-get install --yes bats shellcheck
      - run: ./bagredex.sh check-deploy
